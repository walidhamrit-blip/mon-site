name: G2G PostgreSQL prototype (manual)

# Aucun déclenchement automatique et aucun accès aux fournisseurs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g2g-test-database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Installer les dépendances sans scripts d'installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Tester uniquement le projet Supabase g2g-test
        env:
          G2G_TEST_DATABASE_URL: ${{ secrets.G2G_TEST_DATABASE_URL }}
        run: node scripts/g2g-postgres-integration.mjs
