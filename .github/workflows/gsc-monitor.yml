name: Google Search Console Monitor

# Suivi quotidien intelligent & Pilote automatique SEO (7j/7 à 08:30 UTC) :
# - Relève chaque matin le pouls 7j + la tendance 28j (clics, impressions, CTR, rang).
# - Contrôle /sitemap.xml et ne le resoumet qu'au besoin (lundi, absent, retard >= 7j, ou erreurs).
# - Auto-optimise jusqu'à 2 nouvelles pages Quick Wins / CTR < 3,5 % hors verrou anti-yo-yo (18j),
#   vérifie les types & tests garde-fous, puis déploie automatiquement sur `main` (Vercel + IndexNow).
# - Met à jour quotidiennement le ticket GitHub #269 et n'alerte Telegram hors lundi qu'en cas d'anomalie.

on:
  schedule:
    - cron: "30 8 * * *" # tous les matins à 08:30 UTC (10:30 heure de Tripoli)
  workflow_dispatch:
    inputs:
      days:
        description: "Fenêtre de tendance en jours (7 à 90)"
        required: false
        default: "28"
        type: string
      sitemap_mode:
        description: "Mode sitemap : auto (intelligent), always (forcer), never (ignorer)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - always
          - never

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupération du code
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Installation Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Analyse quotidienne Google Search Console & Sitemap
        id: gsc
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://nokhba.net.ly' }}
          GOOGLE_INDEXING_CLIENT_EMAIL: ${{ secrets.GOOGLE_INDEXING_CLIENT_EMAIL }}
          GOOGLE_INDEXING_PRIVATE_KEY: ${{ secrets.GOOGLE_INDEXING_PRIVATE_KEY }}
          GOOGLE_INDEXING_SITE_URL: ${{ secrets.GOOGLE_INDEXING_SITE_URL || vars.GOOGLE_INDEXING_SITE_URL }}
          GOOGLE_SHEETS_GSC_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_GSC_SPREADSHEET_ID || vars.GOOGLE_SHEETS_GSC_SPREADSHEET_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          INPUT_DAYS: ${{ inputs.days || '28' }}
          INPUT_SITEMAP_MODE: ${{ inputs.sitemap_mode || 'auto' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          ARGS=(--days "${INPUT_DAYS}" --sitemap-mode "${INPUT_SITEMAP_MODE}")
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            ARGS+=(--force-alert)
          fi
          node scripts/gsc-monitor.mjs "${ARGS[@]}"
          STATUS=$(node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync("reports/gsc-monitor-latest.json","utf8")); process.stdout.write(r.status || "skipped");')
          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"

      - name: Auto-optimisation des Quick Wins (avec garde-fou anti-yo-yo 18j)
        id: autopilot
        if: steps.gsc.outputs.status == 'ok'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: |
          node scripts/gsc-auto-optimize.mjs
          if [ -f reports/gsc-monitor-latest.md ]; then
            cat reports/gsc-monitor-latest.md >> "$GITHUB_STEP_SUMMARY"
          fi
          CHANGED=$(node -e 'const fs=require("fs"); const p="reports/gsc-autopilot-latest.json"; const r=fs.existsSync(p)?JSON.parse(fs.readFileSync(p,"utf8")):{changed:false}; process.stdout.write(r.changed ? "true" : "false");')
          echo "changed=${CHANGED}" >> "$GITHUB_OUTPUT"

      - name: Validation garde-fous & déploiement automatique sur main
        if: steps.autopilot.outputs.changed == 'true'
        run: |
          npm ci
          if npm run typecheck && node --test scripts/seo-autopilot.test.mjs scripts/site-identity.test.mjs scripts/website-offer.test.mjs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib/seo-autopilot-data.ts
            git commit -m "seo(autopilot): auto-optimize new Search Console opportunity URLs"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "⚠️ Échec d'un garde-fou : annulation du commit automatique."
            git checkout -- src/lib/seo-autopilot-data.ts
          fi

      - name: Publication de l'artefact Search Console
        uses: actions/upload-artifact@v4
        with:
          name: gsc-monitor-report
          path: reports/gsc-*
          retention-days: 90

      - name: Mise à jour du tableau de suivi GitHub (Pont Arena)
        if: steps.gsc.outputs.status == 'ok'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="📊 Suivi automatique Google Search Console"
          EXISTING_NUMBER=$(gh issue list --state open --search "\"${TITLE}\" in:title" --json number,title --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -n 1)
          if [ -n "${EXISTING_NUMBER}" ]; then
            gh issue edit "${EXISTING_NUMBER}" --body-file reports/gsc-monitor-latest.md
            echo "Issue #${EXISTING_NUMBER} mise à jour."
          else
            gh issue create --title "${TITLE}" --body-file reports/gsc-monitor-latest.md
          fi
