name: Client badge audit

# Vérifie chaque semaine que les sites clients livrés portent bien le badge
# « Website by Nukhba » (lien dofollow vers nokhba.net.ly dans le pied de page).
#
# - mesure : `verified` / `nofollow` / `missing` / `down` par client ;
# - publie `public/badge/clients.json` directement sur `main` quand un statut
#   change (page /badge) — sans dépendre de l'autorisation GitHub de création
#   de Pull Requests ;
# - ouvre ou met à jour une issue listant les sites à corriger.
#
# Aucune clé n'est nécessaire.

on:
  schedule:
    - cron: "30 7 * * 1"
  # Relance immédiate quand l'audit ou la liste des démos change sur main.
  # `public/badge/clients.json` est volontairement absent : ce fichier est
  # produit par l'audit, l'inclure créerait une boucle.
  push:
    branches: [main]
    paths:
      - "scripts/badge-audit.mjs"
      - "src/lib/badge.ts"
      - "src/lib/content.ts"
      - ".github/workflows/badge-audit.yml"
  workflow_dispatch:
    inputs:
      only:
        description: "Slugs à vérifier (séparés par des virgules, vide = tous)"
        required: false
        default: ""

concurrency:
  group: badge-audit
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupération du code
        uses: actions/checkout@v5

      - name: Installation Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Audit du badge
        id: audit
        env:
          BADGE_BASE_URL: https://nokhba.net.ly
        run: |
          ARGS="--concurrency=3"
          if [ -n "${{ inputs.only }}" ]; then
            ARGS="$ARGS --only=${{ inputs.only }}"
          fi
          npm run badge:audit -- $ARGS

      - name: Synthèse
        id: summary
        if: always()
        run: |
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const dir = "reports";
            let summary = { total: 0, verified: 0, nofollow: 0, missing: 0, down: 0, pending: 0 };
            let clients = [];
            if (fs.existsSync(dir)) {
              const files = fs
                .readdirSync(dir)
                .filter((name) => name.startsWith("badge-audit-"))
                .sort();
              if (files.length > 0) {
                const report = JSON.parse(
                  fs.readFileSync(path.join(dir, files[files.length - 1]), "utf8"),
                );
                summary = report.summary ?? summary;
                clients = report.clients ?? [];
              }
            }
            const pending = clients.filter(
              (c) => c.status === "missing" || c.status === "nofollow",
            );
            const lines = [
              `- ✅ vérifiés (dofollow) : **${summary.verified}**`,
              `- ⚠️ nofollow : **${summary.nofollow ?? 0}**`,
              `- ➖ sans badge : **${summary.missing ?? 0}**`,
              `- ✖ hors ligne : **${summary.down ?? 0}**`,
              `- total suivi : ${summary.total ?? 0}`,
            ];
            if (pending.length > 0) {
              lines.push("", "### Sites à corriger", "");
              for (const client of pending) {
                lines.push(
                  `- **${client.slug}** — ${client.url} — ${
                    client.status === "nofollow" ? "lien en `nofollow`" : "aucun lien vers nokhba.net.ly"
                  }`,
                );
              }
            }
            lines.push(
              "",
              "Extrait prêt à coller : https://nokhba.net.ly/badge",
              "",
              `Run : ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            );
            fs.writeFileSync(process.env.GITHUB_OUTPUT, `body<<EOF\n${lines.join("\n")}\nEOF\n`, {
              flag: "a",
            });
            fs.writeFileSync(
              process.env.GITHUB_OUTPUT,
              `verified=${summary.verified ?? 0}\nnofollow=${summary.nofollow ?? 0}\nmissing=${summary.missing ?? 0}\ndown=${summary.down ?? 0}\n`,
              { flag: "a" },
            );
          '

      - name: Publication du rapport
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: badge-audit-report
          path: reports/
          retention-days: 90

      # Commit direct sur `main` : fonctionne nativement avec `contents: write`
      # sans exiger l'option « Allow GitHub Actions to create pull requests ».
      # Aucun risque de boucle : `GITHUB_TOKEN` ne redéclenche pas `on.push` et
      # `public/badge/clients.json` est hors des chemins surveillés.
      - name: Mise à jour du statut sur main
        run: |
          git add public/badge/clients.json
          if git diff --cached --quiet; then
            echo "Aucun changement de statut à publier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(badge): statut des badges clients"
          git checkout -- .
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "public/badge/clients.json publié sur main."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          echo "::error::Impossible de pousser public/badge/clients.json sur main après 3 tentatives."
          exit 1

      - name: Issue — sites sans badge
        if: steps.summary.outputs.missing != '0' || steps.summary.outputs.nofollow != '0'
        uses: actions/github-script@v8
        env:
          SUMMARY_BODY: ${{ steps.summary.outputs.body }}
        with:
          script: |
            const title = "Badge client : sites à corriger (netlinking)";
            const summaryBody = process.env.SUMMARY_BODY ?? "";
            const body = [
              "Audit hebdomadaire du badge « Website by Nukhba ».",
              "",
              summaryBody,
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find(
              (issue) => !issue.pull_request && issue.title === title,
            );
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["badge-client"],
              });
            }

      - name: Clôture de l'issue quand tout est bon
        if: steps.summary.outputs.missing == '0' && steps.summary.outputs.nofollow == '0'
        uses: actions/github-script@v8
        with:
          script: |
            const title = "Badge client : sites à corriger (netlinking)";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find(
              (issue) => !issue.pull_request && issue.title === title,
            );
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: "Tous les sites clients suivis portent désormais le badge. Fermeture automatique. ✅",
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed",
              });
            }
