name: Demo previews

# Captures d'écran automatiques des démos (desktop + mobile) et surveillance
# de disponibilité des sites clients.
#
# - chaque lundi 07:00 UTC, à chaque changement du pipeline ou des démos sur
#   main, et déclenchement manuel ;
# - Playwright + Sharp capturent les `previewUrl` en WebP ;
# - les fichiers modifiés sont publiés directement sur `main` (sans dépendre
#   de l'autorisation GitHub de création de Pull Requests) ;
# - un site de démo hors ligne ouvre (ou met à jour) une issue « Démos hors ligne ».
#
# Aucune clé n'est nécessaire. Le workflow peut être lancé à la main depuis
# l'onglet Actions (« Run workflow »).

on:
  schedule:
    - cron: "0 7 * * 1"
  # Première exécution immédiate dès que le pipeline lui-même ou la liste des
  # démos change sur main : pas besoin d'attendre le lundi suivant, et pas
  # besoin de `workflow_dispatch` (souvent bloqué selon le jeton).
  push:
    branches: [main]
    paths:
      - "scripts/capture-previews.mjs"
      - "src/lib/content.ts"
      - ".github/workflows/demo-previews.yml"
  workflow_dispatch:
    inputs:
      only:
        description: "Slugs à capturer (séparés par des virgules, vide = toutes)"
        required: false
        default: ""
      force:
        description: "Recapturer même si la capture est récente"
        type: boolean
        default: true

concurrency:
  group: demo-previews
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupération du code
        uses: actions/checkout@v5

      - name: Installation Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Installation de Chromium
        run: npx playwright install --with-deps chromium

      - name: Captures des démos
        id: capture
        env:
          CAPTURE_BASE_URL: https://nokhba.net.ly
        run: |
          ARGS="--concurrency=3"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS="$ARGS --max-age-days=6"
          fi
          if [ -n "${{ inputs.only }}" ]; then
            ARGS="$ARGS --only=${{ inputs.only }}"
          fi
          set +e
          npm run previews:capture -- $ARGS
          CODE=$?
          set -e
          if [ "$CODE" -eq 3 ]; then
            echo "::error::Playwright/Sharp indisponible dans ce runner."
            exit 1
          fi
          # Code 1 = erreurs de capture : le rapport et l'artefact restent
          # publiés, mais le run est signalé en échec.
          if [ "$CODE" -eq 1 ]; then
            echo "::warning::Certaines captures ont échoué (voir le rapport)."
            echo "capture_errors=1" >> "$GITHUB_OUTPUT"
          fi
          if [ "$CODE" -eq 4 ]; then
            echo "::error::Aucune démo exploitable."
            exit 1
          fi

      - name: Synthèse du rapport
        id: report
        if: always()
        run: |
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const dir = "reports";
            let summary = { captured: 0, unchanged: 0, down: 0, error: 0, skipped: 0 };
            let down = [];
            if (fs.existsSync(dir)) {
              const files = fs
                .readdirSync(dir)
                .filter((name) => name.startsWith("demo-previews-"))
                .sort();
              if (files.length > 0) {
                const report = JSON.parse(
                  fs.readFileSync(path.join(dir, files[files.length - 1]), "utf8"),
                );
                summary = report.summary ?? summary;
                down = (report.results ?? []).filter((r) => r.outcome === "down");
              }
            }
            const lines = [
              `- capturées : ${summary.captured}`,
              `- inchangées : ${summary.unchanged}`,
              `- hors ligne : ${summary.down}`,
              `- erreurs : ${summary.error}`,
            ];
            for (const item of down) {
              lines.push(`  - ✖ ${item.slug ?? item.url} — ${item.url} (${item.httpStatus ?? "réseau"})`);
            }
            fs.writeFileSync(process.env.GITHUB_OUTPUT, `body<<EOF\n${lines.join("\n")}\nEOF\n`, {
              flag: "a",
            });
            fs.writeFileSync(
              process.env.GITHUB_OUTPUT,
              `captured_count=${summary.captured ?? 0}\ndown_count=${summary.down ?? 0}\nerror_count=${summary.error ?? 0}\n`,
              { flag: "a" },
            );
          '

      - name: Publication du rapport
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: demo-previews-report
          path: reports/
          retention-days: 90

      - name: Alerte — démos hors ligne
        if: always() && steps.report.outputs.down_count != '0'
        uses: actions/github-script@v8
        env:
          REPORT_BODY: ${{ steps.report.outputs.body }}
        with:
          script: |
            const title = "Démos hors ligne — captures d'aperçu impossibles";
            const reportBody = process.env.REPORT_BODY ?? "";
            const body = [
              "Le workflow **Demo previews** n'a pas pu joindre certaines démos.",
              "",
              reportBody,
              "",
              `Run : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "_La dernière capture connue est conservée : le site reste intact._",
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find(
              (issue) => !issue.pull_request && issue.title === title,
            );
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["demo-preview"],
              });
            }

      - name: Clôture de l'alerte quand toutes les démos répondent
        if: always() && steps.report.outputs.down_count == '0' && steps.report.outputs.error_count == '0'
        uses: actions/github-script@v8
        with:
          script: |
            const title = "Démos hors ligne — captures d'aperçu impossibles";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find(
              (issue) => !issue.pull_request && issue.title === title,
            );
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: "Toutes les démos suivies répondent à nouveau. Fermeture automatique. ✅",
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed",
              });
            }

      # Commit direct sur `main` uniquement si au moins une nouvelle capture
      # WebP a été produite (évite un commit bruit quand seul `generatedAt`
      # change). Rebase automatique si un autre workflow a poussé entre-temps.
      - name: Mise à jour des captures sur main
        if: always() && steps.report.outputs.down_count == '0' && steps.report.outputs.error_count == '0' && steps.report.outputs.captured_count != '0'
        run: |
          git add public/previews
          if git diff --cached --quiet; then
            echo "Aucune capture modifiée à publier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(previews): captures desktop/mobile des démos"
          git checkout -- .
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "Captures publiées sur main."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          echo "::error::Impossible de pousser les captures sur main après 3 tentatives."
          exit 1
