name: Audit exemple (temporaire)
on:
  push:
    branches: [arena/f719f724-mon-site]
permissions:
  contents: read
  issues: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Installation des dépendances
        run: npm ci
      - name: Build de production
        run: npm run build
        env:
          DATABASE_URL: ""
      - name: Démarrage du serveur
        run: |
          npx next start -p 3100 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3100/ > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Lighthouse mobile (3 runs)
        run: |
          for i in 1 2 3; do
            npx --yes lighthouse@12 http://localhost:3100/demos/tulin-magazin \
              --output=json --output-path="lh-$i.json" \
              --chrome-flags="--headless --no-sandbox" \
              --only-categories=performance,accessibility,best-practices,seo \
              --form-factor=mobile --quiet
          done
      - name: Résumé
        run: node scripts/lighthouse-summary.mjs lh-1.json lh-2.json lh-3.json > rapport.md
      - name: Publier le rapport
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Audit exemple — résultats Lighthouse" --body-file rapport.md
